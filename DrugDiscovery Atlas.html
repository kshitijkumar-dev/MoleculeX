<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DrugDiscovery Atlas</title>
<style>
:root{--bg:#0A0F1C;--p:#121A2B;--ln:#24304A;--tx:#E6ECF7;--mu:#97A4BC;--c:#36C9D6;--v:#8B7CF6;--ok:#34D399;--nd:#475269;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,sans-serif}a{color:var(--c)}
header{position:sticky;top:0;z-index:5;background:#0A0F1Cee;border-bottom:1px solid var(--ln);display:flex;gap:6px;align-items:center;padding:10px 16px;overflow-x:auto}
header b{margin-right:auto;white-space:nowrap}header a{color:var(--mu);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px;white-space:nowrap}header a.on{color:var(--tx);background:var(--p)}
main{max-width:1060px;margin:auto;padding:24px 16px 60px}h1{font-size:30px;margin:.2em 0}h2{font-size:20px;margin:28px 0 10px}.mu{color:var(--mu)}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:16px}.card.k{cursor:pointer}.card.k:hover{border-color:var(--c)}
input,select,button{font:inherit;color:var(--tx);background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:9px 12px}input{width:100%}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c)}
.pri{background:var(--c);color:#04141a;border:0;font-weight:600}.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);margin:2px 4px 2px 0}.chip.v{border-color:var(--v);color:#c7c0ff}
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--c),var(--v))}.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row span:first-child{width:200px;font-size:13px;color:var(--mu)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.f select{flex:1;min-width:150px}
.ev{display:flex;gap:10px;padding:10px;border-left:3px solid var(--ok);background:var(--p);margin:8px 0;border-radius:0 8px 8px 0}.ev.n{border-color:var(--nd);color:var(--mu)}.ev b{min-width:150px}
.tl{border-left:2px solid var(--ln);margin-left:8px;padding-left:16px}.tl>div{position:relative;margin:10px 0;cursor:pointer}.tl>div:before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--v)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;vertical-align:top;padding:9px;border-bottom:1px solid var(--ln);font-size:14px}th{color:var(--mu);width:140px}.wrap{overflow-x:auto}
.note{background:#1b2440;border:1px solid var(--v);border-radius:10px;padding:12px;margin:12px 0;font-size:14px}
@media(prefers-reduced-motion:no-preference){main{animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(4px)}}}
</style></head><body>
<header><b>◈ DrugDiscovery Atlas</b><a href="#/">Dashboard</a><a href="#/explore">Explorer</a><a href="#/compare">Compare</a><a href="#/timeline">Timeline</a><a href="#/evidence">Evidence</a><a href="#/library">Library</a><a href="#/about">About</a></header>
<main id="app"></main>
<script>
const ND="Not documented in this dataset.",$=id=>document.getElementById(id);
const R=[
[1,"D. Paul, G. Sanap, S. Shenoy, D. Kalyane, K. Kalia, and R. K. Tekade",2020,"Artificial intelligence in drug discovery and development","Drug Discovery Today, vol. 26, no. 1, pp. 80–93","10.1016/j.drudis.2020.10.010","Overview",["Background"]],
[2,"J. Deng, Z. Yang, I. Ojima, D. Samaras, and F. Wang",2021,"Artificial intelligence in drug discovery: applications and techniques","arXiv:2106.05386","arXiv:2106.05386","Overview",["Background"]],
[3,"J. Vamathevan et al.",2019,"Applications of machine learning in drug discovery and development","Nature Reviews Drug Discovery, vol. 18, pp. 463–477","","Overview",["Background"]],
[4,"G. Ghislat, S. Hernandez-Hernandez, C. Piyawajanusorn, and P. J. Ballester",2024,"Data-centric challenges with the application and adoption of artificial intelligence for drug discovery","arXiv:2407.05150","arXiv:2407.05150","Data & bias",["Background"]],
[5,"A. Zhavoronkov et al.",2019,"Deep learning enables rapid identification of potent DDR1 kinase inhibitors","Nature Biotechnology, vol. 37, pp. 1038–1040","10.1038/s41587-019-0224-x","Generative design",["ddr1"]],
[6,"J. M. Stokes et al.",2020,"A deep learning approach to antibiotic discovery","Cell, vol. 180, no. 4, pp. 688–702.e13","10.1016/j.cell.2020.01.021","Antibiotics",["abx","halicin"]],
[7,"J. Jumper et al.",2021,"Highly accurate protein structure prediction with AlphaFold","Nature, vol. 596, no. 7873, pp. 583–589","10.1038/s41586-021-03819-2","Protein structure",["af"]],
[8,"M. K. Jayatunga, M. Ayers, L. Bruens, D. Jayanth, and C. Meier",2024,"How successful are AI-discovered drugs in clinical trials? A first analysis and emerging lessons","Drug Discovery Today, vol. 29, no. 6, p. 104009","10.1016/j.drudis.2024.104009","Clinical evidence",["clin"]]];
const C=[
{id:"ddr1",name:"DDR1 kinase inhibitors (GENTRL)",dis:"Kinase-targeted design (disease not stated here)",tgt:"DDR1 kinase",ai:"Generative deep learning",org:ND,yr:2019,st:"Laboratory-validated (biochemical)",so:2,refs:[5],
 desc:"A deep generative model, GENTRL, designed DDR1 kinase inhibitors.",
 meth:"GENTRL designed molecules in 21 days. Six inhibitors were designed.",
 e:[["Six inhibitors designed; design phase took 21 days. [5]"],["Four tested compounds were active in biochemical assays; 46 days from design to validation (calculated difference: 25 days). [5]"],[0],[0],[0]],
 h:[["Design","AI model designs molecules (21 days)"],["Synthesis and testing","Calculated 25 days (46 − 21)"],["Validation","Four tested compounds active in biochemical assays (46 days total)"]],
 lim:"Biochemical activity does not establish clinical effectiveness. This is one specific study, not a universal speed guarantee.",cur:"Biochemical activity reported. Later development: "+ND},
{id:"abx",name:"AI-identified antibacterial compounds",dis:"Bacterial infection",tgt:"Bacterial growth (specific target "+ND.slice(0,-1)+")",ai:"Deep neural network / virtual screening",org:ND,yr:2020,st:"Laboratory-tested (antibacterial)",so:2,refs:[6],
 desc:"A neural network trained on 2,335 molecules screened libraries of more than 107 million.",
 meth:"Training set: 2,335 molecules. Screening libraries: more than 107 million molecules. 23 predictions tested in the laboratory.",
 e:[["Trained on 2,335 molecules; more than 107 million screened. The training set is not the screening library. [6]"],["23 predictions tested; eight were antibacterial compounds (15 were not: calculated 23 − 8). [6]"],[0],[0],[0]],
 h:[["Training","Model trained on 2,335 molecules"],["Screening","More than 107 million molecules screened"],["Lab testing","23 predictions tested; eight antibacterial"]],
 lim:"Laboratory activity is not clinical evidence. Halicin is described separately and is not stated to be one of the eight.",cur:"Laboratory results reported. Later development: "+ND},
{id:"halicin",name:"Halicin",dis:"Bacterial infection",tgt:ND.slice(0,-1),ai:"Drug repurposing (Drug Repurposing Hub)",org:ND,yr:2020,st:"Computational identification",so:1,refs:[6],
 desc:"Found separately through the Drug Repurposing Hub in the same study.",
 meth:"Identified through the Drug Repurposing Hub, separate from the eight compounds found among the 23 tested predictions.",
 e:[["Found through the Drug Repurposing Hub. [6]"],[0],[0],[0],[0]],
 h:[["Identification","Found via the Drug Repurposing Hub"]],lim:"Further evidence is not covered by this dataset. Do not combine with the eight compounds.",cur:ND},
{id:"af",name:"AlphaFold (protein structure prediction)",dis:"Structural biology (cross-cutting tool)",tgt:"Protein 3D structure from amino acid sequence",ai:"Deep learning structure prediction",org:ND,yr:2021,st:"Computational method",so:1,refs:[7],
 desc:"Predicts 3D protein structures from sequences. A tool, not a drug candidate.",
 meth:"Evaluated in the CASP14 test: median backbone error 0.96 Å (next-best 2.8 Å); median all-atom error 1.5 Å (best alternative 3.5 Å). Lower is better.",
 e:[["CASP14: backbone 0.96 vs 2.8 Å; all-atom 1.5 vs 3.5 Å. [7]"],[0],[0],[0],[0]],
 h:[["CASP14","Median errors reported"]],lim:"Predicted structures support research but do not establish drug effectiveness. Backbone and all-atom errors are different measures.",cur:"Not a drug; no clinical status applies."},
{id:"clin",name:"Clinical progress of AI-discovered drugs",dis:"Clinical development analysis (cross-cutting)",tgt:"Not applicable",ai:"Analysis of AI-discovered molecules",org:ND,yr:2024,st:"Clinical analysis",so:3,refs:[8],
 desc:"Analysis of how AI-discovered molecules perform in clinical trials.",
 meth:"Reported: 67 of 6,147 drugs in clinical development are AI-discovered molecules (≈1%); 24 drugs have AI-discovered targets (≈0.4%, a separate category).",
 e:[[0],[0],[0],["Phase I success 80–90% (historic ≈40–65%); Phase II ≈40% from a limited sample, comparable to historic averages. [8]"],[0]],
 h:[["Phase I","80–90% reported success"],["Phase II","≈40%, limited sample"]],lim:"Limited sample; not a universal success rate. Historic range was summarised and should be checked against the full paper.",cur:"Aggregate analysis only; no single drug."}];
const EV=["Computational prediction","Biochemical / laboratory validation","Preclinical evidence","Clinical evidence","Regulatory outcome"];
const TL=[[2019,"Vamathevan et al.: machine learning in drug discovery [3]","Review of applications and challenges."],[2019,"GENTRL / DDR1 inhibitors [5]","21 days design; 46 days design to validation."],[2020,"Paul et al. review [1]","AI across drug design, synthesis, screening, repurposing."],[2020,"AI-assisted antibiotic discovery [6]","2,335 training molecules; more than 107 million screened; 23 tested; eight antibacterial. Halicin found separately."],[2021,"AlphaFold [7]","CASP14 backbone 0.96 Å vs 2.8 Å."],[2021,"Deng et al. review [2]","Applications and techniques."],[2024,"Clinical progress analysis [8]","Phase I 80–90%; Phase II ≈40% (limited sample)."],[2024,"Ghislat et al. [4]","Data-centric challenges: data quality and bias."]];
const S={q:"",dis:"",ai:"",st:"",yr:"",sort:"new"};let cmp=[];try{cmp=JSON.parse(localStorage.getItem("cmp")||"[]")}catch(e){}
const sv=()=>{try{localStorage.setItem("cmp",JSON.stringify(cmp))}catch(e){}},u=k=>[...new Set(C.map(c=>c[k]))].sort(),$$=(h)=>$("app").innerHTML=h;
const opts=(a,l)=>`<option value="">${l}</option>`+a.map(x=>`<option>${x}</option>`).join("");
const rl=n=>{const r=R.find(r=>r[0]==n),l=r[5]?(r[5].startsWith("arXiv")?"https://arxiv.org/abs/"+r[5].slice(6):"https://doi.org/"+r[5]):"";return`[${n}] ${r[1]}, “${r[3]},” ${r[4]}, ${r[2]}.`+(l?` <a href="${l}" target="_blank" rel="noopener">${r[5].startsWith("arXiv")?"arXiv":"DOI"}</a>`:" (no DOI supplied)")};
function card(c){return`<div class="card"><div class="k" style="cursor:pointer" onclick="location.hash='#/c/${c.id}'"><h3 style="margin:0">${c.name}</h3><p class="mu">${c.desc}</p><span class="chip v">${c.ai}</span><span class="chip">${c.dis}</span><span class="chip">${c.yr}</span><br><span class="chip">${c.st}</span></div><label class="mu"><input type="checkbox" style="width:auto" ${cmp.includes(c.id)?"checked":""} onchange="tg('${c.id}',this)"> Compare</label></div>`}
function tg(id,b){if(b.checked){if(cmp.length>=3){b.checked=false;alert("Compare up to 3 candidates.");return}cmp.push(id)}else cmp=cmp.filter(x=>x!=id);sv()}
const V={
home(){const n=k=>new Set(C.map(c=>c[k])).size,mx=Math.max(...[1,2,3].map(s=>C.filter(c=>c.so==s).length));
$$(`<h1>DrugDiscovery Atlas</h1><p class="mu">Explore the science. Investigate the discoveries. Understand the evidence.</p><input id="hq" placeholder="Search drug candidates, diseases, targets or research..." aria-label="Search" onkeydown="if(event.key=='Enter')gs()"><p><button class="pri" onclick="gs()">Search</button></p>
<div class="g">${[[C.length,"Case studies"],[n("dis"),"Disease areas"],[n("ai"),"AI techniques"],[n("st"),"Development stages"]].map(x=>`<div class="card"><h1 style="margin:0;color:var(--c)">${x[0]}</h1>${x[1]}</div>`).join("")}</div>
<h2>Featured discovery</h2>${card(C[0])}<h2>Case studies by stage</h2><div class="card">${[[1,"Computational"],[2,"Laboratory"],[3,"Clinical analysis"]].map(s=>`<div class="row"><span>${s[1]}</span><div class="bar" style="width:${C.filter(c=>c.so==s[0]).length/mx*60}%"></div><span style="width:20px">${C.filter(c=>c.so==s[0]).length}</span></div>`).join("")}</div>
<h2>Tools</h2><div class="g">${[["explore","Discovery Explorer"],["compare","Compare Discoveries"],["timeline","Research Timeline"],["evidence","Evidence Explorer"],["library","Research Library"]].map(t=>`<a class="card k" href="#/${t[0]}">${t[1]} →</a>`).join("")}</div><p class="mu">Counts are calculated from this small local dataset, not from a real-world database.</p>`)},
explore(){$$(`<h1>Discovery Explorer</h1><input id="q" value="${S.q}" placeholder="Search..." aria-label="Search" oninput="S.q=this.value;rs()"><div class="f"><select id="d" aria-label="Disease area" onchange="S.dis=this.value;rs()">${opts(u("dis"),"All disease areas")}</select><select id="a" aria-label="AI technique" onchange="S.ai=this.value;rs()">${opts(u("ai"),"All AI techniques")}</select><select id="s" aria-label="Stage" onchange="S.st=this.value;rs()">${opts(u("st"),"All stages")}</select><select id="y" aria-label="Year" onchange="S.yr=this.value;rs()">${opts(u("yr"),"All years")}</select><select id="o" aria-label="Sort" onchange="S.sort=this.value;rs()"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">Alphabetical</option><option value="st">Development stage</option></select></div><div class="g" id="rs"></div>`);
["d","a","s","y","o"].forEach((i,k)=>$(i).value=[S.dis,S.ai,S.st,S.yr,S.sort][k]);rs()},
compare(){const l=cmp.map(id=>C.find(c=>c.id==id));if(l.length<2)return $$(`<h1>Compare</h1><div class="card">Select 2–3 candidates with “Compare” in the Explorer. Selected: ${l.length}.</div>`);
const rows=[["Disease area","dis"],["Target","tgt"],["AI technique","ai"],["Approach","meth"],["Experimental validation",c=>c.e[1][0]||ND],["Stage","st"],["Publication",c=>c.refs.map(rl).join("<br>")],["Limitations","lim"]];
$$(`<h1>Compare discoveries</h1><div class="wrap"><table><tr><th></th>${l.map(c=>`<td><b>${c.name}</b><br><button onclick="tg2('${c.id}')">Remove</button></td>`).join("")}</tr>${rows.map(r=>`<tr><th>${r[0]}</th>${l.map(c=>`<td>${typeof r[1]=="function"?r[1](c):c[r[1]]}</td>`).join("")}</tr>`).join("")}<tr><th>Evidence documented</th>${l.map(c=>`<td>${c.e.map((x,i)=>`<div class="mu">${x[0]?"●":"○"} ${EV[i]}</div>`).join("")}</td>`).join("")}</tr></table></div><div class="note">This tool shows differences in approach and evidence. It does not rank candidates or declare a winner.</div>`)},
timeline(){$$(`<h1>Research timeline</h1><p class="mu">Years are publication years from the references. Click an entry.</p><div class="tl">${TL.map((t,i)=>`<div onclick="this.querySelector('p').hidden=!this.querySelector('p').hidden"><b>${t[0]}</b> · ${t[1]}<p class="mu" hidden>${t[2]}</p></div>`).join("")}</div>`)},
evidence(){$$(`<h1>Evidence Explorer</h1><select id="ec" aria-label="Candidate" onchange="ee(this.value)">${C.map(c=>`<option value="${c.id}">${c.name}</option>`).join("")}</select><div id="eb"></div><div class="note">Computational prediction alone does not establish that a drug is safe or effective: predictions must be checked in the laboratory, in preclinical studies and in human trials. Laboratory, animal, human and regulatory evidence are different stages, not equivalents. No confidence scores are given.</div>`);ee(C[0].id)},
library(){const t=[...new Set(R.map(r=>r[6]))];$$(`<h1>Research library</h1><input id="lq" placeholder="Search references..." aria-label="Search references" oninput="lb()"><div class="f"><select id="ly" aria-label="Year" onchange="lb()">${opts([...new Set(R.map(r=>r[2]))].sort(),"All years")}</select><select id="lt" aria-label="Topic" onchange="lb()">${opts(t,"All topics")}</select></div><div id="lr"></div>`);lb()},
about(){$$(`<h1>About</h1><div class="card"><p>Educational, literature-based project. It contains no medical advice and recommends no medicines.</p><p><b>Project:</b> Artificial Intelligence in Drug Discovery: Applications, Techniques and Clinical Evidence<br><b>Course:</b> Biology for Engineers (25BSBE01) · B.Tech AIDD · CSE-AIDD · JAIN (Deemed-to-be University)<br><b>Faculty:</b> Dr. Rohini, Assistant Professor, Department of Basic Science, Faculty of Engineering &amp; Technology<br><b>Team 06:</b> Kashish Singh Tomar, Sanchita Singh, Kshitij Kumar, Debopriya Saha, Prerona De, Debraj De</p></div>`)},
c(id){const c=C.find(x=>x.id==id);if(!c)return $$(`<div class="card">Candidate not found. <a href="#/explore">Back to Explorer</a></div>`);
$$(`<a href="#/explore">← Explorer</a><h1>${c.name}</h1><span class="chip v">${c.ai}</span><span class="chip">${c.st}</span><span class="chip">${c.yr}</span>
<h2>Overview</h2><p>${c.desc}</p><h2>Disease and target</h2><p>${c.dis} · ${c.tgt}</p><h2>How AI was used / methodology</h2><p>${c.meth}</p><h2>Evidence by type</h2>${evh(c)}<h2>Development history</h2><div class="tl">${c.h.map(x=>`<div><b>${x[0]}</b><br><span class="mu">${x[1]}</span></div>`).join("")}</div><h2>Current documented status</h2><p>${c.cur}</p><h2>Limitations and uncertainties</h2><p>${c.lim}</p><h2>References</h2>${c.refs.map(n=>`<p>${rl(n)}</p>`).join("")}`)}};
const evh=c=>c.e.map((x,i)=>`<div class="ev ${x[0]?"":"n"}"><b>${EV[i]}</b><span>${x[0]||ND}</span></div>`).join("");
const ee=id=>$("eb").innerHTML=evh(C.find(c=>c.id==id)),tg2=id=>{cmp=cmp.filter(x=>x!=id);sv();V.compare()},gs=()=>{S.q=$("hq").value;location.hash="#/explore"};
function rs(){let l=C.filter(c=>(!S.dis||c.dis==S.dis)&&(!S.ai||c.ai==S.ai)&&(!S.st||c.st==S.st)&&(!S.yr||c.yr==S.yr)&&(!S.q||JSON.stringify([c.name,c.dis,c.tgt,c.ai,c.desc,c.meth]).toLowerCase().includes(S.q.toLowerCase())));
l.sort((a,b)=>S.sort=="old"?a.yr-b.yr:S.sort=="az"?a.name.localeCompare(b.name):S.sort=="st"?a.so-b.so:b.yr-a.yr);$("rs").innerHTML=l.length?l.map(card).join(""):`<div class="card">No matches. Try clearing a filter.</div>`}
function lb(){const q=$("lq").value.toLowerCase(),y=$("ly").value,t=$("lt").value;const l=R.filter(r=>(!y||r[2]==y)&&(!t||r[6]==t)&&(!q||(r[1]+r[3]+r[4]).toLowerCase().includes(q)));
$("lr").innerHTML=l.length?l.map(r=>`<div class="card" style="margin:8px 0">${rl(r[0])}<br><span class="chip">${r[6]}</span>${r[7][0]=="Background"?`<span class="chip">Background reference</span>`:r[7].map(i=>`<a class="chip v" href="#/c/${i}">Supports: ${C.find(c=>c.id==i).name}</a>`).join("")}</div>`).join(""):`<div class="card">No references match.</div>`}
function route(){const p=location.hash.slice(2).split("/"),f=V[p[0]||"home"];(f||V.home)(p[1]);document.querySelectorAll("header a").forEach(a=>a.classList.toggle("on",a.hash=="#/"+(p[0]=="c"?"explore":p[0])));scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>
